# Configuración para Netlify: la web está en /public y el login, guardado y fotos en /netlify/functions
[build]
  publish = "public"
  command = ""

[functions]
  node_bundler = "esbuild"

# Cabeceras de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# El panel de administrador se abre en /admin
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true
