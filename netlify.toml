# Configuración para Netlify (sitio estático: se publica solo la carpeta public)
[build]
  publish = "public"
  command = ""

# Mismas cabeceras de seguridad que usa server.js
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# El panel de administrador se abre en /admin
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200
  force = true
